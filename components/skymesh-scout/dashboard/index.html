<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyMesh Scout / AegisNet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0E13">
<link rel="stylesheet" href="css/main.css">
<style>
  /* P4 additional tokens */
  :root { --purple:#9B7FE8; --purple-dim:#4A3A7A; }
  .navbtn.on[data-page=comms]{color:var(--purple);border-left-color:var(--purple)}
  .badge-exp{font-size:9px;border:1px solid var(--amber-dim);border-radius:2px;padding:1px 5px;color:var(--amber);letter-spacing:.08em;vertical-align:middle}

  .navbtn.on[data-page=network]{color:#9B7FE8;border-left-color:#9B7FE8}
  .navbtn.on[data-page=safety]{color:var(--green);border-left-color:var(--green)}
  .navbtn.on[data-page=meshmap]{color:var(--sea);border-left-color:var(--sea)}
</style>
</head>
<body>

<!-- ===== STATUS BAR ===== -->
<div id="statusBar">
  <div class="sb-brand">SKY<b>MESH</b> · AEGISNET <span style="font-size:9px;color:var(--dim);letter-spacing:.1em">EXP</span></div>
  <div class="sb-chips">
    <div class="chip" id="chipSrc"><span class="dot"></span><span id="srcLabel">DEMO</span></div>
    <div class="chip" id="chipMqtt"><span class="dot"></span><span id="mqttLabel">MQTT OFF</span></div>
    <div class="chip" id="chipMesh"><span class="dot"></span><span>MESH OFF</span></div>
    <div class="chip" id="chipGps"><span class="dot dot-ok"></span><span id="gpsLabel">GPS --</span></div>
    <div class="chip" id="chipRoute"><span class="dot"></span><span id="routeLabel">NO ROUTE</span></div>
    <div class="chip"><span id="acCount">0</span> AC &nbsp;·&nbsp; <span id="shCount">0</span> SH &nbsp;·&nbsp; <span id="trCount">0</span> TR</div>
    <div class="chip chip-notice">⚠ SITUATIONAL AWARENESS ONLY — NOT RADAR OR CERTIFIED AVIONICS</div>
    <div class="chip"><span id="clock">--:--:--Z</span></div>
  </div>
</div>

<!-- ===== MAIN LAYOUT ===== -->
<div id="app">
  <nav id="sidebar">
    <button class="navbtn on" data-page="aircraft" title="Aircraft">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 16L3 12l18-4-1.5 4L21 16z"/></svg>
      <span>AIRCRAFT</span>
    </button>
    <button class="navbtn" data-page="ships" title="Ships">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l9 4 9-4M3 17V9l9-4 9 4v8"/><line x1="12" y1="5" x2="12" y2="21"/></svg>
      <span>SHIPS</span>
    </button>
    <button class="navbtn" data-page="trains" title="Trains">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="17" rx="2"/><path d="M6 12h12M9 2v5M15 2v5M6 19l-2 3M18 19l2 3"/></svg>
      <span>TRAINS</span>
    </button>
    <button class="navbtn" data-page="projector" title="Projector">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="10" rx="2"/><circle cx="12" cy="12" r="2"/></svg>
      <span>PROJECTOR</span>
    </button>
    <button class="navbtn" data-page="comms" title="Comms Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>COMMS</span>
    </button>
    <button class="navbtn" data-page="awareness" title="Links">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10A15 15 0 0 1 8 12 15 15 0 0 1 12 2z"/></svg>
      <span>LINKS</span>
    </button>
    <button class="navbtn" data-page="field" title="Field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="2,22 12,2 22,22"/><line x1="12" y1="12" x2="12" y2="17"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>
      <span>FIELD</span>
    </button>
    <button class="navbtn" data-page="chat" title="Mesh Chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>CHAT</span>
    </button>
    <button class="navbtn" data-page="admin" title="Admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>ADMIN</span>
    </button>
    <button class="navbtn" data-page="network" title="Network Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="7.05" y2="7.05"/><line x1="16.95" y1="16.95" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="7.05" y2="16.95"/><line x1="16.95" y1="7.05" x2="19.78" y2="4.22"/></svg>
      <span>NETWORK</span>
    </button>
    <button class="navbtn" data-page="safety" title="Safety &amp; Education">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>SAFETY</span>
    </button>
    <button class="navbtn" data-page="meshmap" title="Mesh Map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><line x1="12" y1="8" x2="5" y2="16"/><line x1="12" y1="8" x2="19" y2="16"/></svg>
      <span>MESH MAP</span>
    </button>
    <button class="navbtn" data-page="about" title="About">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>ABOUT</span>
    </button>
    <div class="nav-spacer"></div>
    <div class="nav-ver">PROTO 4</div>
  </nav>

  <main id="pages">
    <!-- P3 pages (unchanged) -->
    <div id="pg-aircraft"  class="page on"></div>
    <div id="pg-ships"     class="page"></div>
    <div id="pg-trains"    class="page"></div>
    <div id="pg-projector" class="page"></div>
    <div id="pg-awareness" class="page"></div>
    <div id="pg-field"     class="page"></div>
    <div id="pg-chat"      class="page"></div>
    <div id="pg-admin"     class="page"></div>
    <div id="pg-about"     class="page"></div>
    <!-- P4 new page -->
    <div id="pg-comms"     class="page"></div>
  <div id="pg-network" class="page"></div>
  <div id="pg-safety"  class="page"></div>
  <div id="pg-meshmap" class="page"></div>
</main>
</div>

<div id="toast"></div>

<!-- P3 scripts (unchanged) -->
<script src="js/sources.js"></script>
<script src="js/mqtt.js"></script>
<script src="js/pages.js"></script>
<script src="js/field.js"></script>
<script src="js/app.js"></script>

<!-- P4 expansion layer (append-only) -->
<script src="js/comms-adapters.js"></script>
<script src="js/comms-router.js"></script>
<script src="js/tracking-adapters.js"></script>
<script src="js/tracking-router.js"></script>
<script src="js/webrtc.js"></script>
<script src="js/p4-pages.js"></script>
<script src="js/p4-app.js"></script>

<script>
/* Route badge update — runs in status bar every 3s */
setInterval(() => {
  const best = window.CommsRouter?.bestAdapter();
  const chip = document.getElementById("chipRoute");
  const lbl  = document.getElementById("routeLabel");
  if (!chip || !lbl) return;
  if (best) {
    chip.className = "chip c-ok";
    chip.querySelector(".dot").className = "dot dot-ok";
    lbl.textContent = best.displayName.toUpperCase();
  } else {
    chip.className = "chip c-warn";
    chip.querySelector(".dot").className = "dot dot-warn";
    lbl.textContent = "NO ROUTE";
  }
}, 3000);
</script>

<!-- P4.2 expansion -->
<script src="js/node-identity.js"></script>
<script src="js/ais-hardware.js"></script>
<script src="js/test-mode.js"></script>
<script src="js/health-check.js"></script>
<script src="js/p4.2-pages.js"></script>

<!-- P4.3 expansion -->
<script src="js/transport-adapters.js"></script>
<script src="js/network-settings.js"></script>
<script src="js/safety-education.js"></script>
<script src="js/p4.3-pages.js"></script>


<!-- P4.4 expansion -->
<script src="js/sky-projector.js"></script>
<script src="js/node-registry.js"></script>
<script src="js/p4.4-pages.js"></script>

</body>
</html>
